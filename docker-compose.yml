name: alrifai

services:
  # =============================================================================
  # NEW PLATFORM DATABASE - Independent PostgreSQL, NOT ai-postgres
  # =============================================================================
  alrifai-postgres:
    image: postgres:17-alpine@sha256:f02121de6f74d30d8a94cd1d9584125e2178d7e6c377d8130112d4e52d867995
    container_name: alrifai-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5434:5432"
    networks:
      - alrifai-net
    volumes:
      - "./.local-data/postgres:/var/lib/postgresql/data"
      - ./database/init-sql:/docker-entrypoint-initdb.d:ro
      - ./database/migrations/V006__authentication.sql:/docker-entrypoint-initdb.d/006_authentication.sql:ro
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-alrifai}
      - POSTGRES_USER=${POSTGRES_USER:-alrifai}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alrifai} -d ${POSTGRES_DB:-alrifai}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # =============================================================================
  # NEW OPEN WEBUI - Pinned release v0.11.3 (NOT :main mutable tag)
  # =============================================================================
  alrifai-open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.3
    container_name: alrifai-open-webui
    restart: unless-stopped
    ports:
      - "127.0.0.1:8502:8080"
    networks:
      - alrifai-net
    volumes:
      - "./.local-data/open-webui:/app/backend/data"
    environment:
      # Local-only mode: AL-RIFAI gates /home; Open WebUI stores state in its
      # own local data directory and does not require a second login.
      - WEBUI_AUTH=false
      - ENABLE_SIGNUP=false
      # --- Privacy ---
      - ENABLE_COMMUNITY_SHARING=false
      - SCARF_NO_ANALYTICS=true
      - DO_NOT_TRACK=true
      - ANONYMIZED_TELEMETRY=false
      - USE_OLLAMA_DOCKER=false
      - USE_CUDA_DOCKER=false
      - USE_SLIM_DOCKER=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # =============================================================================
  # NEW PLATFORM ADMIN SHELL (lightweight utility container)
  # =============================================================================
  alrifai-cli:
    image: postgres:17-alpine
    container_name: alrifai-cli
    restart: "no"
    networks:
      - alrifai-net
      - ai-network
    volumes:
      - ./database:/workspace/db:ro
      - ./scripts:/workspace/scripts:ro
    environment:
      - PGHOST=alrifai-postgres
      - PGDATABASE=${POSTGRES_DB:-alrifai}
      - PGUSER=${POSTGRES_USER:-alrifai}
      - PGPASSWORD=${POSTGRES_PASSWORD}
    profiles:
      - admin
    entrypoint: ["/bin/sh"]
    tty: true

networks:
  alrifai-net:
    driver: bridge
  ai-network:
    external: true
